<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anteprima PDF — Luxseetarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --ink:#0b0a14;
    --gold:#d4af6a;
    --gold-soft:rgba(212,175,106,.55);
    --fg:#ece6d8;
    --muted:#9a91a8;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;
    background:radial-gradient(ellipse at top,#1a1430 0%,#0b0a14 60%,#050410 100%);
    color:var(--fg);
    font-family:'Cormorant Garamond',Georgia,serif;
    min-height:100%;
  }
  .bar{
    position:sticky;top:0;z-index:10;
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;
    padding:16px 20px;
    background:rgba(11,10,20,.92);
    border-bottom:1px solid rgba(212,175,106,.28);
    backdrop-filter:blur(8px);
  }
  .bar p{
    margin:0;width:100%;text-align:center;
    font-style:italic;color:var(--muted);font-size:16px;
  }
  button{
    appearance:none;border:none;cursor:pointer;
    background:linear-gradient(135deg,#e6c587,#b88a3e);
    color:#1a1208;border-radius:12px;padding:12px 22px;
    font-family:'Cinzel',serif;letter-spacing:.18em;font-size:13px;font-weight:600;
  }
  button.ghost{
    background:transparent;border:1px solid var(--gold-soft);color:var(--gold);
  }
  .status{min-height:1.2em;font-size:14px;color:var(--gold);text-align:center;width:100%}
  .stage{
    max-width:860px;margin:28px auto 60px;padding:0 16px;
  }
  .hint{
    text-align:center;color:var(--muted);font-style:italic;margin:0 0 18px;font-size:17px;
  }
  #preview-frame{
    border:1px solid var(--gold-soft);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(212,175,106,.18),0 10px 40px -10px rgba(0,0,0,.7);
  }
</style>
</head>
<body>
  <div class="bar">
    <p>Demo PDF — stessi stili della lettura, senza passare dal flusso completo.</p>
    <button type="button" id="btn-download">SCARICA PDF DI PROVA</button>
    <a class="ghost" href="index.html" style="display:inline-flex;align-items:center;justify-content:center;padding:12px 22px;border-radius:12px;border:1px solid rgba(212,175,106,.55);color:#d4af6a;text-decoration:none;font-family:'Cinzel',serif;letter-spacing:.18em;font-size:13px;">TORNA AL SITO</a>
    <div class="status" id="status"></div>
  </div>

  <div class="stage">
    <p class="hint">Sotto vedi l’anteprima esatta di ciò che verrà messo nel PDF.</p>
    <div id="preview-frame"></div>
  </div>

<script>
(function(){
  function sig(inner){ return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
  var POSITIONS = ['Passato','Presente','Futuro'];
  var CARDS = ['La Luna', 'Gli Amanti', 'Le Stelle'];
  var SYMBOLS = {
    "Gli Amanti": sig('<circle cx="22" cy="30" r="10"/><circle cx="42" cy="30" r="10"/><path d="M32 42 V52"/>'),
    "Le Stelle":  sig('<path d="M32 10 L36 26 L52 28 L40 38 L44 54 L32 46 L20 54 L24 38 L12 28 L28 26 Z"/>'),
    "La Luna":    sig('<path d="M42 14 a20 20 0 1 0 0 36 a16 16 0 1 1 0 -36 z"/>')
  };

  var SAMPLE_NAME = 'Giulia';
  var SAMPLE_QUESTION = 'Cosa mi aspetta in amore nei prossimi mesi?';
  var SAMPLE_TEXT =
    '**La Luna** apre questa lettura con un invito a guardare oltre le apparenze. Nel passato qualcosa è rimasto in sospeso: emozioni non dette, intuizioni che non hai ancora seguito fino in fondo.\n\n'+
    'Nel presente, **Gli Amanti** parlano di una scelta del cuore. Non è solo attrazione: è la domanda su cosa vuoi davvero scegliere, e a quale verità sei pronta a restare fedele.\n\n'+
    '**Le Stelle** chiudono con una luce più chiara. Il futuro non arriva come certezza assoluta, ma come direzione: se ascolti ciò che senti senza forzarlo, una forma di speranza concreta può prendere corpo.\n\n'+
    'Questa lettura ti chiede di unire intuizione e coraggio. Lascia che il dubbio ti guidi, non che ti fermi. C’è spazio per un incontro più autentico — se scegli di restare presente a te stessa.';

  function escapeHtml(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function textToHtmlParagraphs(text){
    return String(text||'').split(/\n{2,}/).map(function(p){
      var inner = escapeHtml(p)
        .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#d4af6a;font-family:\'Cinzel\',Georgia,serif;letter-spacing:.08em;font-weight:600;">$1</strong>')
        .replace(/\n/g, '<br/>');
      return '<p style="margin:0 0 14px;font-family:\'Cormorant Garamond\',Georgia,serif;font-size:14pt;line-height:1.7;color:#ece6d8;">'+inner+'</p>';
    }).join('');
  }
  function buildPdfCardsHtml(){
    var cells = CARDS.map(function(name, i){
      var sym = SYMBOLS[name] || sig('<circle cx="32" cy="32" r="20"/>');
      var svg = String(sym)
        .replace('<svg ', '<svg width="52" height="52" style="display:block;margin:0 auto 8px;stroke:#d4af6a;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;" ');
      return (
        '<div style="flex:1;min-width:96px;max-width:130px;border:1px solid rgba(212,175,106,.55);border-radius:14px;padding:14px 10px;background:linear-gradient(160deg,#1c1638 0%,#0e0820 100%);text-align:center;">'+
          '<div style="font-family:\'Cormorant Garamond\',Georgia,serif;font-style:italic;font-size:10pt;color:#9a91a8;margin-bottom:8px;">'+escapeHtml(POSITIONS[i]||'')+'</div>'+
          svg+
          '<div style="font-family:\'Cinzel\',Georgia,serif;font-size:10pt;letter-spacing:.1em;color:#d4af6a;margin-top:8px;">'+escapeHtml(name)+'</div>'+
        '</div>'
      );
    }).join('');
    return '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0 28px;">'+cells+'</div>';
  }
  function buildPdfHtml(){
    return (
      '<div style="box-sizing:border-box;width:100%;background:#0b0a14;color:#ece6d8;padding:36px 32px 40px;">'+
      '<div style="text-align:center;font-family:\'Cinzel\',Georgia,serif;letter-spacing:.45em;color:rgba(212,175,106,.75);font-size:11pt;margin-bottom:18px;">LUXSEETAROT</div>'+
      '<h1 style="font-family:\'Cinzel\',Georgia,serif;color:#d4af6a;text-align:center;font-size:22pt;font-weight:600;letter-spacing:.06em;margin:0 0 12px;">Lettura completa</h1>'+
      '<p style="text-align:center;font-family:\'Cormorant Garamond\',Georgia,serif;font-style:italic;color:#9a91a8;font-size:13pt;margin:0 0 8px;">Per '+escapeHtml(SAMPLE_NAME)+'</p>'+
      '<p style="text-align:center;font-family:\'Cormorant Garamond\',Georgia,serif;font-style:italic;color:#9a91a8;font-size:12pt;margin:0 0 8px;">« '+escapeHtml(SAMPLE_QUESTION)+' »</p>'+
      buildPdfCardsHtml()+
      '<div style="max-width:640px;margin:0 auto;">'+textToHtmlParagraphs(SAMPLE_TEXT)+'</div>'+
      '<p style="text-align:center;font-family:\'Cormorant Garamond\',Georgia,serif;font-style:italic;color:#9a91a8;margin-top:28px;font-size:10pt;">Intrattenimento e riflessione simbolica. Non sostituisce consigli medici, legali o finanziari.</p>'+
      '</div>'
    );
  }

  var preview = document.getElementById('preview-frame');
  var statusEl = document.getElementById('status');
  preview.innerHTML = buildPdfHtml();

  document.getElementById('btn-download').addEventListener('click', function(){
    if(typeof html2pdf !== 'function'){
      statusEl.textContent = 'Libreria PDF non disponibile.';
      return;
    }
    statusEl.textContent = 'Generazione PDF in corso...';

    var old = document.getElementById('pdf-capture-root');
    if(old && old.parentNode) old.parentNode.removeChild(old);

    var element = document.createElement('div');
    element.id = 'pdf-capture-root';
    element.setAttribute('aria-hidden', 'true');
    element.style.cssText = 'position:fixed;left:0;top:0;width:794px;margin:0;padding:0;background:#0b0a14;color:#ece6d8;opacity:0.01;pointer-events:none;z-index:2147483646;';
    element.innerHTML = buildPdfHtml();
    document.body.appendChild(element);

    var opt = {
      margin: [10, 10, 12, 10],
      filename: 'anteprima-lettura-luxseetarot.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#0b0a14',
        logging: false,
        scrollX: 0,
        scrollY: -window.scrollY,
        windowWidth: 794,
        onclone: function(clonedDoc){
          var node = clonedDoc.getElementById('pdf-capture-root');
          if(node){
            node.style.opacity = '1';
            node.style.left = '0';
            node.style.top = '0';
            node.style.position = 'absolute';
            node.style.width = '794px';
            node.style.zIndex = '1';
            node.style.background = '#0b0a14';
            node.style.color = '#ece6d8';
          }
        }
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    };

    function cleanup(){
      if(element && element.parentNode) element.parentNode.removeChild(element);
    }

    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontsReady.then(function(){
      return new Promise(function(resolve){ setTimeout(resolve, 80); });
    }).then(function(){
      return html2pdf().set(opt).from(element).save();
    }).then(function(){
      cleanup();
      statusEl.textContent = 'PDF scaricato con successo.';
    }).catch(function(){
      cleanup();
      statusEl.textContent = 'Errore nel download del PDF.';
    });
  });
})();
</script>
</body>
</html>
