<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0b0a14;--gold:#d4af6a;--fg:#ece6d8;--muted:#9a91a8}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:radial-gradient(ellipse at top,#1a1430 0%,#0b0a14 60%,#050410 100%);color:var(--fg);font-family:'Cormorant Garamond',serif}
  a{color:rgba(212,175,106,.85);text-decoration:none}
  a:hover{color:var(--gold)}
  .wrap{max-width:720px;margin:0 auto;padding:48px 22px 64px}
  .brand{font-family:'Cinzel',serif;letter-spacing:.28em;font-size:13px;color:var(--gold);text-align:center;margin-bottom:18px}
  .crumbs{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:rgba(154,145,168,.8);margin:0 0 22px}
  .crumbs a{color:rgba(212,175,106,.75)}
  .preview-banner{display:none;text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0b0a14;background:rgba(212,175,106,.88);padding:10px 14px;border-radius:8px;margin:0 0 22px}
  .preview-banner.show{display:block}
  h1{font-family:'Cinzel',serif;font-weight:500;font-size:clamp(22px,4vw,30px);letter-spacing:.08em;text-align:center;margin:0 0 12px;color:var(--gold);line-height:1.3}
  .desc{text-align:center;font-size:19px;line-height:1.65;color:rgba(154,145,168,.98);margin:0 0 10px}
  .meta{text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(154,145,168,.65);margin:0 0 32px}
  .status{text-align:center;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.12em;color:var(--muted);margin:40px 0}
  .article{font-size:19px;line-height:1.75;color:rgba(154,145,168,.98)}
  .article h2{font-family:'Cinzel',serif;font-weight:500;font-size:16px;letter-spacing:.1em;color:rgba(232,213,163,.92);margin:32px 0 12px}
  .article h3{font-family:'Cinzel',serif;font-weight:500;font-size:14px;letter-spacing:.08em;color:rgba(232,213,163,.85);margin:24px 0 10px}
  .article p{margin:0 0 14px}
  .article ul,.article ol{margin:0 0 16px;padding-left:1.2em}
  .article li{margin:0 0 8px}
  .article strong{color:rgba(236,230,216,.92);font-weight:500}
  .faq{margin:40px 0 0;padding-top:24px;border-top:1px solid rgba(212,175,106,.14)}
  .faq h2{font-family:'Cinzel',serif;font-weight:500;font-size:16px;letter-spacing:.1em;color:rgba(232,213,163,.92);margin:0 0 16px}
  .faq details{margin:0 0 12px;padding:12px 0;border-bottom:1px solid rgba(212,175,106,.1)}
  .faq summary{cursor:pointer;font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;color:rgba(236,230,216,.9)}
  .faq p{font-size:18px;line-height:1.65;color:rgba(154,145,168,.98);margin:10px 0 0}
  .cta{display:block;text-align:center;margin:40px 0 8px;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .footer-nav{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;margin:28px 0 12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  footer{text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(154,145,168,.55);padding:0 22px 40px}
  #article-root[hidden]{display:none}
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand"><a href="/">LUXSEETAROT</a></div>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Home</a> · <a href="/blog.html">Blog</a> · Articolo</nav>
    <div id="preview-banner" class="preview-banner">Anteprima bozza (solo admin)</div>
    <div id="article-status" class="status">Caricamento…</div>
    <article id="article-root" hidden>
      <h1 id="article-title"></h1>
      <p class="desc" id="article-desc"></p>
      <p class="meta" id="article-meta"></p>
      <div class="article" id="article-body"></div>
      <div class="faq" id="article-faq" hidden></div>
      <a class="cta" href="/">Inizia la lettura gratuita →</a>
    </article>
    <nav class="footer-nav" aria-label="Link utili">
      <a href="/blog.html">Blog</a>
      <a href="/tarocchi-amore.html">Amore</a>
      <a href="/contatti.html">Contatti</a>
      <a href="/privacy.html">Privacy</a>
    </nav>
  </main>
  <footer>Luxseetarot © 2026</footer>
  <script>
  (function(){
    var params = new URLSearchParams(window.location.search);
    var slug = (params.get('slug') || '').trim();
    var preview = params.get('preview') === '1';
    var secret = '';
    try { secret = sessionStorage.getItem('luxsee_admin_secret') || ''; } catch(e){}
    if(!secret) secret = (params.get('secret') || '').trim();

    var statusEl = document.getElementById('article-status');
    var root = document.getElementById('article-root');
    var titleEl = document.getElementById('article-title');
    var descEl = document.getElementById('article-desc');
    var metaEl = document.getElementById('article-meta');
    var bodyEl = document.getElementById('article-body');
    var faqEl = document.getElementById('article-faq');
    var banner = document.getElementById('preview-banner');

    function escapeHtml(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function setMeta(name, content){
      var el = document.querySelector('meta[name="'+name+'"]');
      if(el) el.setAttribute('content', content);
    }
    function setOg(prop, content){
      var el = document.querySelector('meta[property="'+prop+'"]');
      if(el) el.setAttribute('content', content);
    }
    function fmtDate(iso){
      if(!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' });
      } catch(e){ return ''; }
    }

    if(!slug){
      statusEl.textContent = 'Articolo non trovato.';
      return;
    }

    var url = '/api/blog?action=get&slug=' + encodeURIComponent(slug);
    if(preview) url += '&preview=1';
    if(preview && secret) url += '&secret=' + encodeURIComponent(secret);

    fetch(url, preview && secret ? { headers: { Authorization: 'Bearer ' + secret } } : undefined)
      .then(function(r){ return r.json().then(function(j){ return { status: r.status, body: j }; }); })
      .then(function(res){
        if(!res.body || !res.body.ok || !res.body.post){
          statusEl.textContent = res.status === 404
            ? 'Articolo non disponibile.'
            : 'Impossibile caricare l’articolo.';
          return;
        }
        var post = res.body.post;
        var cleanUrl = 'https://luxseetarot.com/blog/' + encodeURIComponent(post.slug);
        document.title = post.title + ' | Luxseetarot';
        setMeta('description', post.description || '');
        setOg('og:title', post.title + ' | Luxseetarot');
        setOg('og:description', post.description || '');
        setOg('og:url', cleanUrl);
        var canon = document.querySelector('link[rel="canonical"]');
        if(canon) canon.href = cleanUrl;
        if(post.preview){
          setMeta('robots', 'noindex,nofollow');
          if(banner) banner.classList.add('show');
        }

        titleEl.textContent = post.title;
        descEl.textContent = post.description || '';
        metaEl.textContent = fmtDate(post.publishedAt || post.updatedAt);
        bodyEl.innerHTML = post.bodyHtml || '';

        var faq = post.faq || [];
        if(faq.length){
          faqEl.hidden = false;
          faqEl.innerHTML = '<h2>Domande frequenti</h2>' + faq.map(function(item){
            return '<details><summary>'+escapeHtml(item.q)+'</summary><p>'+escapeHtml(item.a)+'</p></details>';
          }).join('');
          var ld = {
            '@context': 'https://schema.org',
            '@type': 'FAQPage',
            mainEntity: faq.map(function(item){
              return {
                '@type': 'Question',
                name: item.q,
                acceptedAnswer: { '@type': 'Answer', text: item.a }
              };
            })
          };
          var script = document.createElement('script');
          script.type = 'application/ld+json';
          script.textContent = JSON.stringify(ld);
          document.head.appendChild(script);
        }

        var articleLd = {
          '@context': 'https://schema.org',
          '@type': 'Article',
          headline: post.title,
          description: post.description || '',
          datePublished: post.publishedAt || post.createdAt,
          dateModified: post.updatedAt || post.publishedAt || post.createdAt,
          author: { '@type': 'Organization', name: 'Luxseetarot' },
          publisher: { '@type': 'Organization', name: 'Luxseetarot', url: 'https://luxseetarot.com/' },
          mainEntityOfPage: cleanUrl
        };
        var aScript = document.createElement('script');
        aScript.type = 'application/ld+json';
        aScript.textContent = JSON.stringify(articleLd);
        document.head.appendChild(aScript);

        statusEl.hidden = true;
        root.hidden = false;
        if(window.history && window.history.replaceState && !preview){
          try { window.history.replaceState({}, '', '/blog/' + encodeURIComponent(post.slug)); } catch(e){}
        }
      })
      .catch(function(){
        statusEl.textContent = 'Impossibile caricare l’articolo.';
      });
  })();
  </script>
</body>
</html>
