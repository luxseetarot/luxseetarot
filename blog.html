  <script>
  (function(){
    var statusEl = document.getElementById('blog-status');
    var listEl = document.getElementById('blog-list');
    function escapeHtml(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtDate(iso){
      if(!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' });
      } catch(e){ return ''; }
    }
    fetch('/api/blog?action=list')
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data.ok){
          statusEl.textContent = 'Impossibile caricare gli articoli.';
          return;
        }
        var posts = data.posts || [];
        if(!posts.length){
          statusEl.textContent = 'Presto nuovi articoli. Nel frattempo puoi fare una lettura gratuita.';
          return;
        }
        statusEl.hidden = true;
        listEl.hidden = false;
        listEl.innerHTML = posts.map(function(p){
          var href = '/blog/' + encodeURIComponent(p.slug);
          var when = fmtDate(p.publishedAt || p.updatedAt);
          var thumb = p.coverImage
            ? '<a href="'+href+'"><img class="thumb" src="'+escapeHtml(p.coverImage)+'" alt="'+escapeHtml(p.coverAlt||p.title||'')+'" loading="lazy" decoding="async" width="1600" height="900" /></a>'
            : '';
          return '<article class="post-item">'+
            thumb+
            '<h2><a href="'+href+'">'+escapeHtml(p.title)+'</a></h2>'+
            '<p>'+escapeHtml(p.description||'')+'</p>'+
            (when ? '<div class="post-meta">'+escapeHtml(when)+'</div>' : '')+
          '</article>';
        }).join('');
      })
      .catch(function(){
        statusEl.textContent = 'Impossibile caricare gli articoli.';
      });
  })();
  </script>
