name: Seed publish blog lot F

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/_lib/blog-seed-articles-f.js'
      - 'api/cron-blog-publish.js'

jobs:
  seed-publish-f:
    runs-on: ubuntu-latest
    steps:
      - name: Seed + publish lotto F
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Manca CRON_SECRET nei secrets GitHub."
            exit 1
          fi
          RESOLVED_SITE_URL="${SITE_URL:-https://www.luxseetarot.com}"
          RESOLVED_SITE_URL="${RESOLVED_SITE_URL%/}"
          case "$RESOLVED_SITE_URL" in
            http://luxseetarot.com|https://luxseetarot.com)
              RESOLVED_SITE_URL="https://www.luxseetarot.com"
              ;;
          esac
          SECRET_ENC=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["CRON_SECRET"], safe=""))')
          ENDPOINT="${RESOLVED_SITE_URL}/api/cron-blog-publish?job=seed-f&secret=${SECRET_ENC}"
          echo "Chiamata ${RESOLVED_SITE_URL}/api/cron-blog-publish?job=seed-f"
          # Attende deploy Vercel dopo push (max ~3 min)
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /tmp/seed-f.json -w "%{http_code}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              "$ENDPOINT" || true)
            echo "Tentativo $i → HTTP $CODE"
            cat /tmp/seed-f.json || true
            echo
            if [ "$CODE" = "200" ]; then
              python3 - <<'PY'
import json
data=json.load(open('/tmp/seed-f.json'))
print('published', data.get('published'))
print('already', data.get('already'))
print('missing', data.get('missing'))
print('errors', data.get('errors'))
print('seeded', (data.get('seed') or {}).get('seeded'))
if data.get('errors'):
  raise SystemExit(1)
PY
              exit 0
            fi
            sleep 30
          done
          echo "::error::Seed/publish lotto F non riuscito dopo i tentativi."
          exit 1
